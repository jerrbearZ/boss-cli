<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boss Workflow Dashboard</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Boss Workflow Dashboard</h1>
          <p id="dbPath">Local workflow control</p>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" type="button">Refresh</button>
          <button id="pauseBtn" type="button">Pause</button>
          <button id="resumeBtn" type="button">Resume</button>
          <button id="stopBtn" class="danger" type="button">Stop</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel status-panel" aria-label="System status">
          <h2>Status</h2>
          <div class="metric-grid">
            <div><span>Paused</span><strong id="pausedMetric">-</strong></div>
            <div><span>Sender</span><strong id="senderMetric">-</strong></div>
            <div><span>Candidates</span><strong id="candidateMetric">0</strong></div>
            <div><span>Queued</span><strong id="queuedMetric">0</strong></div>
            <div><span>Verified</span><strong id="verifiedMetric">0</strong></div>
            <div><span>Failed</span><strong id="failedMetric">0</strong></div>
          </div>
        </section>

        <section class="panel control-panel" aria-label="Workflow controls">
          <h2>Control Room</h2>
          <div class="form-grid">
            <label>Limit <input id="syncLimit" type="number" min="1" max="500" value="100"></label>
            <label>Label <input id="syncLabel" type="number" min="0" value="0"></label>
            <label>Job <input id="syncJob" type="text" placeholder="optional encJobId"></label>
          </div>
          <div class="button-row">
            <button id="syncBtn" type="button">Sync Inbox</button>
            <button id="selectVisibleBtn" type="button">Select Visible</button>
            <button id="clearSelectionBtn" type="button">Clear</button>
          </div>
          <div class="send-controls">
            <label>Max sends <input id="maxActions" type="number" min="1" max="100" value="5"></label>
            <label>Delay seconds <input id="delaySeconds" type="number" min="0" max="600" value="60"></label>
            <button id="startSenderBtn" class="primary" type="button">Start Sender</button>
          </div>
        </section>

        <section class="panel composer-panel" aria-label="Message composer">
          <h2>Message Composer</h2>
          <label>Template name <input id="templateName" type="text" value="dashboard_message"></label>
          <textarea id="messageBody" rows="5" placeholder="Type the exact message to send"></textarea>
          <div class="button-row">
            <button id="saveTemplateBtn" type="button">Approve Template</button>
            <button id="enqueueBtn" class="primary" type="button">Enqueue Selected</button>
          </div>
          <p class="hint"><span id="selectionCount">0</span> selected. Template id: <span id="templateId">none</span></p>
        </section>

        <section class="panel table-panel candidates-panel" aria-label="Inbox review">
          <div class="section-head">
            <h2>Inbox Review</h2>
            <input id="candidateFilter" type="search" placeholder="Filter candidates">
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Select</th>
                  <th>Candidate</th>
                  <th>Job</th>
                  <th>Stage</th>
                  <th>Latest</th>
                  <th>Outbound</th>
                </tr>
              </thead>
              <tbody id="candidateRows"></tbody>
            </table>
          </div>
        </section>

        <section class="panel table-panel queue-panel" aria-label="Queue">
          <h2>Queue</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Status</th>
                  <th>Candidate</th>
                  <th>Template</th>
                  <th>Attempts</th>
                  <th>Error</th>
                </tr>
              </thead>
              <tbody id="queueRows"></tbody>
            </table>
          </div>
        </section>

        <section class="panel events-panel" aria-label="Events">
          <h2>Events</h2>
          <ol id="eventRows"></ol>
        </section>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
