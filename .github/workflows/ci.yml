name: CI

on:
  push:
    branches:
      - main
      - "*-automation-deployment"
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev shellcheck libgtk-3-0t64 libx11-xcb1 libasound2t64

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Formatting consistency
        run: uv run ruff format --check .

      - name: Type checking
        run: uv run pyright boss_cli

      - name: Locked dependency vulnerability audit
        run: |
          uv export --locked --all-extras --no-hashes --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements-audit.txt"

      - name: High-severity Python security scan
        run: uvx bandit -q -lll -r boss_cli

      - name: Test
        run: uv run python -m pytest -p no:capture -q -m 'not smoke'

      - name: Validate Linux deployment scripts and user units
        run: |
          find scripts/linux -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck -x scripts/linux/*.sh
          scripts=(
            install-boss-automation.sh
            set-boss-automation-secrets.sh
            start-boss-automation.sh
            stop-boss-automation.sh
            get-boss-automation-status.sh
            backup-boss-automation.sh
            update-boss-automation.sh
            uninstall-boss-automation.sh
            validate-boss-automation-runtime.sh
          )
          for script in "${scripts[@]}"; do
            "scripts/linux/$script" --app-root "$PWD" --uv "$(command -v uv)" --validation-only
          done
          scripts/linux/restore-boss-automation.sh \
            --app-root "$PWD" --uv "$(command -v uv)" --backup uv.lock --validation-only
          uv run python scripts/linux/render-systemd-units.py \
            --app-root "$PWD" --uv "$(command -v uv)" \
            --xdg-config-home "$RUNNER_TEMP/config" \
            --xdg-data-home "$RUNNER_TEMP/data" \
            --xdg-state-home "$RUNNER_TEMP/state" \
            --xdg-cache-home "$RUNNER_TEMP/cache" \
            --output-dir "$RUNNER_TEMP/systemd-user"
          systemd-analyze --user verify "$RUNNER_TEMP/systemd-user"/*.{service,timer}

      - name: Install and smoke-test pinned Linux Camoufox runtime
        run: uv run python -m boss_cli.camoufox_runtime install --smoke

      - name: Build package
        run: uv build

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Formatting consistency
        run: uv run ruff format --check .

      - name: Type checking
        run: uv run pyright boss_cli

      - name: Test, including Windows DPAPI and WAL coverage
        run: uv run python -m pytest -p no:capture -q -m "not smoke"

      - name: CLI and migration smoke checks
        shell: pwsh
        run: |
          uv run boss --help | Out-Null
          uv run boss workflow init-db --db "$env:RUNNER_TEMP\workflow.db" --json | Out-Null
          uv run boss deployment init --config "$env:RUNNER_TEMP\deployment.json" --json | Out-Null
          uv run boss deployment validate --config "$env:RUNNER_TEMP\deployment.json" --json | Out-Null

      - name: Parse and validate PowerShell deployment scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw "PowerShell parse error in $($_.Name): $($parseErrors[0].Message)"
            }
          }
          ./scripts/windows/Install-BossAutomation.ps1 -AppRoot $PWD -ValidationOnly
          ./scripts/windows/Set-BossAutomationSecrets.ps1 -AppRoot $PWD -ValidationOnly
          ./scripts/windows/Start-BossAutomation.ps1 -AppRoot $PWD -ValidationOnly
          ./scripts/windows/Stop-BossAutomation.ps1 -AppRoot $PWD -ValidationOnly
          ./scripts/windows/Get-BossAutomationStatus.ps1 -AppRoot $PWD -ValidationOnly
          ./scripts/windows/Backup-BossAutomation.ps1 -AppRoot $PWD -ValidationOnly
          $revision = (& git rev-parse HEAD).Trim()
          ./scripts/windows/Update-BossAutomation.ps1 -AppRoot $PWD -Revision $revision -ValidationOnly
          ./scripts/windows/Uninstall-BossAutomation.ps1 -AppRoot $PWD -ValidationOnly
          ./scripts/windows/Restore-BossAutomation.ps1 -AppRoot $PWD -BackupPath uv.lock -ValidationOnly

      - name: Install and smoke-test pinned Camoufox runtime
        shell: pwsh
        run: uv run python -m boss_cli.camoufox_runtime install --smoke

      - name: Build package
        run: uv build
